<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221C46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<title>Pluxee Health Scan</title>
<style>
/* =========================================================
   TOKENS — troque aqui pelo Design System Pluxee
   Todo o wireframe usa só estas variáveis.
   ========================================================= */
:root{
  /* Tokens do DS Pluxee (Figma: plx/semantic/*) */
  --c-bg:#FFFFFF;            /* fundo branco (antes background/primary #FAF8FF) */
  --c-surface:#FFFFFF;
  --c-surface-2:#F3F3FC;     /* background/info */
  --c-line:#E2E8F0;          /* Greyscale/200 */
  --c-line-strong:#B5B2BC;   /* text/disabled */
  --c-text:#221C46;          /* text/primary · brand/primary */
  --c-text-2:#463F5F;        /* text/secondary */
  --c-text-3:#716E7C;        /* text/quaternary */
  --c-header:#221C46;        /* brand/primary */
  --c-on-header:#FFFFFF;     /* text/inverse */
  --c-accent:#00EB5E;        /* brand/secondary */
  --c-on-accent:#221C46;
  --c-accent-soft:#C7FCCA;   /* brand/secondary-dimmed */
  --c-accent-light:#85FD96;  /* brand/secondary-light */
  --c-accent-strong:#01AD43; /* ultraGreen/6 */
  --c-info-soft:#DEF3FB;     /* brand/tertiary-dimmed */
  --c-placeholder:#EDEBF5;
  --radius:12px;
  --radius-sm:8px;
  --space:16px;
  --font: "TT Travels", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);min-height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit}

/* ---------- App em tela cheia (responsivo) ---------- */
.phone{width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--c-bg);position:relative;overflow:hidden}
@media (min-width:481px){ body{background:#EDEBF5} .phone{box-shadow:0 0 0 1px var(--c-line)} }
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}


/* ---------- Notas de design (desktop) ---------- */
.notes{width:340px;max-height:844px;overflow:auto;background:#fafafa;border:1px solid #999;padding:20px;font-size:13px;line-height:1.5}
.notes h2{font-size:15px;margin-bottom:4px}
.notes .sub{color:#666;margin-bottom:14px}
.notes ol{padding-left:18px}
.notes li{margin-bottom:10px}
.notes .tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid #888;padding:1px 6px;margin-right:4px}
.notes .jump{margin-top:16px;border-top:1px solid #ccc;padding-top:12px}
.notes .jump button{display:block;width:100%;padding:6px 8px;border:1px solid #bbb;margin-bottom:4px;background:#fff;font-size:12px}
.notes .jump button:hover{background:#eee}

/* ---------- Elementos base ---------- */
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;background:var(--c-header);color:var(--c-on-header);flex-shrink:0}
.statusbar.light{background:var(--c-bg);color:var(--c-text)}
.topbar{background:var(--c-header);color:var(--c-on-header);padding:6px 16px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar h1{font-size:18px;font-weight:700;flex:1}
.topbar .sub{font-size:12px;opacity:.7;font-weight:400}
.iconbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px}
.logo-ph{width:26px;height:26px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.pad{padding:16px}
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.flat{border:0}
.card.dashed{border:1.5px dashed var(--c-line-strong);background:transparent}
.card.dark{background:var(--c-header);color:var(--c-on-header);border:0}
.card.soft{background:var(--c-surface-2);border:0}
.h2{font-size:17px;font-weight:700;margin-bottom:4px}
.h3{font-size:15px;font-weight:700}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--c-text-2);margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec button{text-transform:none;letter-spacing:0;font-weight:600;text-decoration:underline;font-size:13px}
.muted{color:var(--c-text-2);font-size:13px}
.tiny{color:var(--c-text-3);font-size:11px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 16px;font-weight:700;font-size:15px;border-radius:var(--radius);width:100%}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)}
.btn.secondary{background:var(--c-surface);border:1.5px solid var(--c-text)}
.btn.ghost{text-decoration:underline;height:40px}
.btn.sm{height:36px;font-size:13px;width:auto}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--c-line-strong);font-size:12px;font-weight:600;background:var(--c-surface);border-radius:var(--radius);white-space:nowrap}
.chip.solid{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.chip.dark{background:rgba(0,0,0,.55);color:#fff;border-color:transparent}
.pill-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border:1px solid currentColor}
.bar{height:8px;background:var(--c-accent-soft);position:relative;overflow:hidden}
.bar > i{position:absolute;inset:0 auto 0 0;background:var(--c-accent);display:block}
.bar.thin{height:5px}
.bar.light{background:rgba(255,255,255,.25)}
.bar.light > i{background:#fff}
.ph{background:var(--c-placeholder);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--c-text-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ph.x::before,.ph.x::after{content:"";position:absolute;width:142%;height:1px;background:var(--c-line-strong);top:50%;left:-21%}
.ph.x::before{transform:rotate(30deg)}
.ph.x::after{transform:rotate(-30deg)}
.ph span{position:relative;background:var(--c-placeholder);padding:2px 6px;z-index:1}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--c-placeholder);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--c-text-2);flex-shrink:0}
.ico{width:40px;height:40px;background:var(--c-surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:20px;height:20px}
.ico.lg{width:52px;height:52px}
.ico.lg svg{width:26px;height:26px}
.list > *{border-bottom:1px solid var(--c-line);padding:12px 0}
.list > *:last-child{border-bottom:0}
.divider{height:1px;background:var(--c-line);margin:12px 0}
.toggle{width:44px;height:26px;background:var(--c-line);position:relative;flex-shrink:0;border-radius:13px;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{background:var(--c-accent)}
.toggle.on::after{left:21px}
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--c-accent);display:inline-block}

/* ---------- Bottom nav da feature ---------- */
.fnav{height:78px;background:var(--c-surface);border-top:1px solid var(--c-line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;flex-shrink:0;padding-bottom:12px;position:relative}
.fnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--c-text-3)}
.fnav button.on{color:var(--c-text)}
.fnav button svg{width:22px;height:22px}
.fnav .scanbtn{width:62px;height:62px;background:var(--c-accent);color:var(--c-on-accent);border-radius:50%;margin:-34px auto 0;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);border:4px solid var(--c-bg)}
.fnav .scanbtn svg{width:26px;height:26px}

/* ---------- Anel de progresso ---------- */
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .center b{font-size:24px;font-weight:800;line-height:1}
.ring .center small{font-size:11px;color:var(--c-text-2)}

/* ---------- Câmera ---------- */
.cam{background:#3a3a3a;color:#fff}
.cam .viewfinder{flex:1;position:relative;background:repeating-linear-gradient(45deg,#454545 0 12px,#404040 12px 24px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cam .viewfinder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .guide{width:260px;height:260px;border-radius:50%;border:2px dashed rgba(255,255,255,.8);position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;color:rgba(255,255,255,.85);padding:30px}
.cam .tips{position:absolute;bottom:16px;left:0;right:0;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.cam .ctx{position:absolute;top:12px;left:12px;right:12px}
.cam .modes{display:flex;justify-content:center;gap:22px;padding:14px 0 6px;font-size:13px;font-weight:700;color:rgba(255,255,255,.55)}
.cam .modes button.on{color:#fff;border-bottom:2px solid #fff;padding-bottom:4px}
.cam .shutterrow{display:flex;align-items:center;justify-content:space-around;padding:12px 24px 30px}
.cam .shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.cam .shutter i{width:58px;height:58px;border-radius:50%;background:#fff;display:block}
.cam .side{width:48px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:3px}
.cam .side svg{width:24px;height:24px}

/* ---------- Analisando ---------- */
.scanline{position:absolute;left:0;right:0;height:3px;background:#fff;box-shadow:0 0 18px #fff;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:8%}to{top:90%}}
.steps li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px;opacity:.35;transition:.3s}
.steps li.done,.steps li.now{opacity:1}
.steps li .st{width:20px;height:20px;border:2px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.steps li.done .st{background:currentColor}
.steps li.done .st::after{content:"✓";color:var(--c-header);font-weight:900}

/* ---------- Bottom sheet / modal ---------- */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;animation:fade .2s}
.overlay.center{align-items:center;justify-content:center;padding:24px}
.sheet{background:var(--c-surface);width:100%;max-height:88%;overflow:auto;padding:20px 16px 28px;animation:up .25s ease-out}
.sheet .grab{width:40px;height:4px;background:var(--c-line);margin:-8px auto 14px}
.dialog{background:var(--c-surface);width:100%;padding:24px;text-align:center;animation:pop .3s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;background:#777;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(900px) rotate(540deg)}}

/* ---------- Push notification ---------- */
.push{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;background:rgba(250,250,250,.97);border:1px solid var(--c-line);padding:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:16px;animation:drop .4s ease-out;cursor:pointer}
@keyframes drop{from{transform:translateY(-130%)}}
.push .app{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c-text-2);margin-bottom:4px}
.push .app i{width:16px;height:16px;background:var(--c-header);display:inline-block;border-radius:4px}

/* ---------- Toast ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--c-header);color:#fff;padding:12px 14px;font-size:13px;font-weight:600;z-index:70;animation:up .25s ease-out;display:flex;gap:10px;align-items:center}

/* ---------- Gráfico de barras ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:var(--c-line-strong)}
.bars .b.today i{background:var(--c-accent)}
.bars .b.empty i{background:transparent;border:1.5px dashed var(--c-line-strong)}
.bars .b small{font-size:11px;color:var(--c-text-2)}
.bars .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--c-text);font-size:10px;color:var(--c-text-2)}
.bars .goal span{position:absolute;right:0;top:-15px;background:var(--c-surface);padding:0 4px}

/* ---------- Week strip ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{padding:6px 0;font-size:11px;color:var(--c-text-2)}
.week div b{display:flex;width:30px;height:30px;margin:4px auto 0;align-items:center;justify-content:center;border:1.5px solid var(--c-line-strong);border-radius:50%;font-size:12px;color:var(--c-text)}
.week div.done b{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
.week div.freeze b{border-style:dashed}
.week div.today b{border:2px solid var(--c-text);font-weight:800}

/* ---------- Badges ---------- */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badgex{text-align:center;font-size:11px;font-weight:600}
.badgex .medal{width:58px;height:58px;margin:0 auto 6px;border-radius:50%;background:var(--c-accent);color:var(--c-on-accent);display:flex;align-items:center;justify-content:center}
.badgex .medal svg{width:26px;height:26px}
.badgex.locked .medal{background:var(--c-surface-2);color:var(--c-text-3);border:1.5px dashed var(--c-line-strong)}
.badgex.locked{color:var(--c-text-3)}

/* ---------- Mini home Pluxee ---------- */
.homehead{background:var(--c-header);color:#fff;padding:4px 20px 18px}
.wallet{background:var(--c-surface);border:1px solid var(--c-line);padding:14px}
.lunchcard{background:var(--c-surface);border:2px solid var(--c-text);padding:16px;position:relative;margin-top:16px}
.lunchcard .flag{position:absolute;top:-10px;left:12px;background:var(--c-text);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 8px;text-transform:uppercase}
.hnav{height:74px;background:var(--c-surface);border-top:1px solid var(--c-line);display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;padding-bottom:10px}
.hnav div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600;color:var(--c-text-3)}
.hnav div.on{color:var(--c-text)}
.hnav div i{width:22px;height:22px;border:1.5px solid currentColor;display:block}

/* ---------- Itens do resultado ---------- */
.item{display:flex;gap:12px;align-items:flex-start}
.conf{font-size:10px;font-weight:700;padding:2px 6px;border:1px solid var(--c-line-strong)}
.conf.low{border-style:dashed;border-color:var(--c-text)}
.segbar{display:flex;height:10px;gap:2px}
.segbar i{display:block;background:var(--c-text)}
.segbar i:nth-child(2){background:var(--c-text-2)}
.segbar i:nth-child(3){background:var(--c-line-strong)}
.legend{display:flex;gap:14px;font-size:12px;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--c-text)}
.legend span:nth-child(2)::before{background:var(--c-text-2)}
.legend span:nth-child(3)::before{background:var(--c-line-strong)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{border:1.5px solid var(--c-line-strong);height:40px;font-size:12px;font-weight:700;text-align:center}
.presets button.on{background:var(--c-accent);color:var(--c-on-accent);border-color:var(--c-accent)}
input[type=range]{width:100%;accent-color:#1a1a1a}
.field{border:1.5px solid var(--c-line-strong);height:44px;width:100%;padding:0 12px;background:var(--c-surface)}

/* ---------- Chat LIA ---------- */
.msg{max-width:85%;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:8px}
.msg.me{background:var(--c-accent);color:var(--c-on-accent);margin-left:auto}
.msg.bot{background:var(--c-surface-2)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;background:var(--c-text-3);border-radius:50%;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}

/* =========================================================
   CAMADA PLUXEE (aplicação do DS sobre o wireframe)
   ========================================================= */
body{letter-spacing:-.01em}
.statusbar{background:var(--c-header)}
.topbar{background:var(--c-header);padding:6px 16px 18px;background-image:radial-gradient(circle at 85% -20%,rgba(0,235,94,.18),transparent 45%)}
.topbar .iconbtn{background:#fff;color:var(--c-text);border-radius:var(--radius-sm);width:34px;height:34px}
.topbar .iconbtn svg{width:18px;height:18px}
.logo-ph{border:0;background:var(--c-accent);color:var(--c-header);border-radius:8px;font-size:15px;font-weight:900;width:28px;height:28px}
.card{border-radius:var(--radius);border-color:var(--c-line)}
.card.dashed{border-color:var(--c-line-strong);background:transparent}
.card.soft{background:var(--c-surface-2)}
.card.dark{background:var(--c-header);background-image:radial-gradient(circle at 100% 0,rgba(0,235,94,.22),transparent 55%)}
.h2,.h3,.big{color:inherit}
.sec{text-transform:none;letter-spacing:-.01em;font-size:15px;color:var(--c-text);font-weight:700}
.sec button{color:#1E4FD8;text-decoration:none}
.btn{border-radius:var(--radius)}
.btn.primary{background:var(--c-accent);color:var(--c-on-accent)}
.btn.primary.deep{background:var(--c-header);color:#fff}
.btn.secondary{border-color:var(--c-text);color:var(--c-text)}
.btn.ghost{color:var(--c-text);text-decoration:none}
.btn.danger{color:#D92D20}
.bars .b.empty i{background:transparent}
.chip{border:0;background:var(--c-surface-2);color:var(--c-text-2);border-radius:var(--radius-sm);padding:6px 10px}
.chip.solid{background:var(--c-header);color:#fff}
.chip.dark{background:rgba(34,28,70,.75);color:#fff;border-radius:999px}
.pill-tag{border:0;background:var(--c-accent-soft);color:var(--c-text);border-radius:6px;padding:3px 7px}
.bar{background:var(--c-line);border-radius:99px}
.bar > i{background:var(--c-accent);border-radius:99px}
.bar.light{background:rgba(255,255,255,.18)}
.bar.light > i{background:var(--c-accent)}
.ph{background:var(--c-placeholder);border-radius:var(--radius-sm);color:var(--c-text-3)}
.ph span{background:var(--c-placeholder)}
.ph.x::before,.ph.x::after{background:#D6D3E4}
.ico{background:var(--c-accent-soft);color:var(--c-text);border-radius:50%}
.avatar{background:var(--c-accent);color:var(--c-header)}
.toggle.on{background:var(--c-accent-strong)}
.badge-dot{background:var(--c-accent)}
.list > *{border-color:var(--c-line)}
.conf{border:0;background:var(--c-accent-soft);border-radius:6px;color:var(--c-text)}
.conf.low{background:#FFF1C2;border:0}
.segbar{border-radius:99px;overflow:hidden}
.segbar i{background:var(--c-header)}

  goal:null, pesos:[], passos:{}, rotulo:false, liaAsked:false, semNumeros:false,

try { const saved = JSON.parse(localStorage.getItem(STORE) || "null"); if (saved) S = Object.assign(fresh(), saved, { screen:"home", meal:null, viewing:null, photo:null, pushShown:false }); } catch (e) {}
function persist() {
  const { meal, viewing, photo, label, menu, anError, ...keep } = S;
  try { localStorage.setItem(STORE, JSON.stringify(keep)); }
  catch (e) {
    // armazenamento cheio: guarda o progresso trocando as fotos enviadas pelas ilustrativas
    try {
      const light = { ...keep, meals: keep.meals.map((m, i) => m.photo && m.photo.startsWith("data:") ? { ...m, photo: DEMOS[i % DEMOS.length].photo } : m) };
      localStorage.setItem(STORE, JSON.stringify(light));
    } catch (e2) {}
  }
}

/* ---------- regras ---------- */
const WEEKDAYS = ["Segunda","Terça","Quarta","Quinta","Sexta"];
const SHORT = ["Seg","Ter","Qua","Qui","Sex"];
function dayInfo(i) {
  const d = new Date(2026, 10, 16); // segunda, 16/11/2026
  d.setDate(d.getDate() + Math.floor(i / 5) * 7 + (i % 5));
  const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  return { wd:i % 5, long:`${WEEKDAYS[i % 5]}, ${d.getDate()} de ${meses[d.getMonth()]}`, short:`${SHORT[i % 5]}, ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`, week:Math.floor(i / 5) };
}
const totalsOf = (items) => items.reduce((a, it) => ({ kcal:a.kcal+it.kcal, c:a.c+it.c, p:a.p+it.p, f:a.f+it.f }), { kcal:0, c:0, p:0, f:0 });
const cores = (m) => new Set(m.items.map(i => i.cor)).size;
const mealOfDay = (d) => S.meals.find(m => m.day === d);
const registeredToday = () => !!mealOfDay(S.day);
function streak() {
  let d = registeredToday() ? S.day : S.day - 1, n = 0;
  while (d >= 0 && mealOfDay(d)) { n++; d--; }
  return n;
}
/* Dados de saúde informados pela própria pessoa (entrada manual, funciona no navegador) */
const passosHoje = () => (S.passos && S.passos[S.day]) || 0;
const pesoAtual = () => S.pesos && S.pesos.length ? S.pesos[S.pesos.length - 1].kg : (S.goal ? S.goal.peso : 0);
const anySource = () => (S.pesos && S.pesos.length > 0) || Object.values(S.passos || {}).some(n => n > 0);
const hasWatch = () => passosHoje() > 0;
const hasWeight = () => S.pesos && S.pesos.length > 0;
/* estimativa simples: cerca de 0,5 kcal por kg de peso a cada mil passos */
const kcalAtivas = () => Math.round(passosHoje() * (pesoAtual() || 75) * 0.0005);
const fmt1 = (n) => n.toFixed(1).replace(".", ",");
function level() {
  let i = 0; while (S.xp >= LEVELS[i + 1].min) i++;
  return { n:i + 1, name:LEVELS[i].name, base:LEVELS[i].min, next:LEVELS[i + 1].min };
}
function teamRank() {
  return TEAM_BASE.map(t => ({ ...t, pts: t.pts + (t.me ? S.meals.length * 20 : 0) })).sort((a, b) => b.pts - a.pts).map((t, i) => ({ ...t, pos:i + 1 }));
}
/* Concede missões cumpridas e devolve o que foi ganho */
function checkMissions() {
  const gained = [];
  MISSIONS.forEach(m => {
    if (!S.done[m.id] && m.prog() >= m.tot) {
      S.done[m.id] = true; S.xp += m.xp; gained.push(m);
      if (m.badge && !S.badges.includes(m.badge)) S.badges.push(m.badge);
    }
  });
  return gained;
}
function celebrateQuick(gained) {
  if (!gained.length) return;
  confetti();
  gained.forEach((m, i) => setTimeout(() => toast(`Missão concluída: ${m.t} · +${m.xp} XP${m.badge ? " · medalha " + m.badge : ""}`, IC.trophy), i * 2700));
}
const pts = () => S.xp; // pontos acumulados = XP total
const imc = () => S.goal ? pesoAtual() / (S.goal.altura * S.goal.altura) : 0;

function statusbar(light) {
  // espaço da área segura do aparelho (notch / barra de status real)
  return `<div class="safetop ${light ? "light" : ""}"></div>`;
}
function topbar(title, sub, opts = {}) {
  return `<div class="topbar">
    <button class="iconbtn" data-a="${opts.back || "go:home"}" aria-label="Voltar">${IC.back}</button>
    <h1>${title}${sub ? `<div class="sub">${sub}</div>` : ""}</h1>
    ${opts.right || `<div class="logo-ph">✕</div>`}
  </div>`;
}
function fnav(active) {
  const b = (id, label, ic) => `<button class="${active === id ? "on" : ""}" data-a="go:${id}">${ic}<span>${label}</span></button>`;
  return `<nav class="fnav"><div class="pillnav">
    ${b("hoje", "Hoje", IC.home)}
    ${b("historico", "Histórico", IC.hist)}
    <button class="scanbtn" data-a="go:camera" aria-label="Fotografar prato">${IC.camera}</button>
    ${b("missoes", "Missões", IC.trophy)}
    ${b("saude", "Saúde", IC.heart)}
  </div></nav>`;
}
function ring(value, max, size = 132, label = "", sub = "") {
  const r = (size - 14) / 2, c = 2 * Math.PI * r, pct = Math.min(value / max, 1);
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--c-accent-soft)" stroke-width="12" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--c-accent)" stroke-width="12" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/></svg>
    <div class="center"><b>${label}</b><small>${sub}</small></div></div>`;
}
function toast(msg, ic = IC.check) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<span style="width:18px;height:18px;display:inline-flex">${ic}</span>${msg}`;
  document.getElementById("phone").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function confetti() {
  const c = document.createElement("div"); c.className = "confetti";
  for (let i = 0; i < 40; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.animationDelay = Math.random() * .6 + "s";
    p.style.background = ["#00EB5E", "#221C46", "#85FD96", "#C7FCCA"][i % 4];
    c.appendChild(p);
  }
  document.getElementById("phone").appendChild(c);
  setTimeout(() => c.remove(), 2600);
}
function openLayer(html, center) {
  $layer.innerHTML = `<div class="overlay ${center ? "center" : ""}" data-a="closeLayer">${html}</div>`;
}
function closeLayer() { $layer.innerHTML = ""; }

function homeChipsText() {
  const st = streak(), next = MISSIONS.find(m => m.grp === "semana" && !S.done[m.id]);
  return st ? `${st} ${st === 1 ? "dia" : "dias"} seguidos · +20 XP` : (next ? `${next.t} ${Math.min(next.prog(), next.tot)}/${next.tot}` : "+20 XP por almoço");
}
function homeChips() {
  if (!S.meals.length) return `<span class="chip">+50 XP na primeira foto</span><span class="chip">Missão Primeira foto</span>`;
  const next = MISSIONS.find(m => m.grp === "semana" && !S.done[m.id]);
  const st = streak();
  return `${st ? `<span class="chip">${IC.flame.replace('<svg','<svg width="14" height="14"')} ${st} ${st === 1 ? "dia" : "dias"} seguidos</span>` : ""}<span class="chip">+20 XP</span>${next ? `<span class="chip">${next.t} ${Math.min(next.prog(), next.tot)}/${next.tot}</span>` : ""}`;
}

/* Card do Health Scan na home: mesmo design antes e depois do primeiro uso */
function hsCard() {
  const first = !S.meals.length;
  const today = mealOfDay(S.day), st = streak(), lv = level();
  const next = MISSIONS.find(m => m.grp === "semana" && !S.done[m.id]);
  const recent = S.meals.slice(-4).reverse().map(m => m.photo);
  const s16 = (ic) => ic.replace('<svg','<svg width="15" height="15"');
  let headline, stats, foodsText, cta;
  if (first) {
    headline = "Descubra as calorias do seu prato com uma foto";
    stats = `<span>${s16(IC.camera)} 1. Fotografe</span><span>${s16(IC.sparkle)} 2. IA analisa</span><span>${s16(IC.leaf)} 3. Coma bem</span>`;
    foodsText = "+50 XP na primeira foto";
    cta = `<button class="hs-cta" data-a="go:camera">${IC.camera}Fotografar meu prato</button>`;
  } else {
    headline = today ? `Almoço de hoje registrado${today.local ? " no " + today.local : ""}` : "Hora do almoço? Registre seu prato";
    const kc = today ? totalsOf(today.items).kcal : 0;
    stats = `
      <span class="hs-stat"><small>Almoço hoje</small><b>${today ? (S.semNumeros ? cores(today) + " cores" : num(kc) + " kcal") : "Pendente"}</b></span>
      <span class="hs-stat"><small>Sequência</small><b>${s16(IC.flame)} ${st} ${st === 1 ? "dia" : "dias"}</b></span>
      <span class="hs-stat"><small>Nível ${lv.n}</small><b>${S.xp} XP</b></span>`;
    foodsText = `${S.meals.length} ${S.meals.length === 1 ? "almoço" : "almoços"} · ${S.badges.length} ${S.badges.length === 1 ? "medalha" : "medalhas"}${next ? `<br><span style="opacity:.8;font-weight:600">${next.t} ${Math.min(next.prog(), next.tot)}/${next.tot}</span>` : ""}`;
    cta = today
      ? `<button class="hs-cta" data-a="go:hoje">${IC.chart || IC.home}Ver meu dia</button>`
      : `<button class="hs-cta" data-a="go:camera">${IC.camera}Fotografar meu prato · +20 XP</button>`;
  }
  const pics = first ? ["hoje","ter","seg","qui"].map(f => `assets/pratos/${f}.jpg`) : recent;
  return `
      <div class="hscard">
        <div class="hs-top">
          <div class="hs-icon">${hsIcon(64)}</div>
          <div class="hs-name">Pluxee <b>Health Scan</b></div>
        </div>
        <div class="hs-headline">${headline}</div>
        <div class="hs-steps">${stats}</div>
        <div class="hs-foods">
          ${pics.map(src => `<img src="${src}" alt="">`).join("")}
          <span>${foodsText}</span>
        </div>
        ${cta}
      </div>`;
}

/* ---------- 1. Hoje (dashboard pessoal, cresce com o uso) ---------- */
SCREENS.hoje = () => {
  const lv = level(), di = dayInfo(S.day), today = mealOfDay(S.day), st = streak();
  const consumido = today ? totalsOf(today.items).kcal : 0;
  const ativas = hasWatch() ? kcalAtivas() : 0;
  const restante = Math.max(USER.metaDia - consumido + ativas, 0);
  const jornada = MISSIONS.filter(m => m.grp === "jornada");

<div class="screen">

      <div class="tiny mt8" style="color:rgba(255,255,255,.65)">${S.xp - lv.base}/${lv.next - lv.base} XP · faltam ${lv.next - S.xp} XP para o Nível ${lv.n + 1}</div>
    </div>`}

    ${jornadaDone < jornada.length ? `

        <span class="grow"><b style="font-size:14px;${ok ? "text-decoration:line-through" : ""}">${m.t}</b><div class="muted">${m.d}</div></span>

      ` : `
      <div class="row" style="gap:18px">
        ${ring(consumido, USER.metaDia, 128, num(restante), "kcal restantes")}

          <div class="tiny">Meta do dia</div><div class="h3">${num(USER.metaDia)} kcal</div>

          <div class="row between muted"><span>Ativas (passos)</span><b>${hasWatch() ? "+" + ativas : "—"}</b></div>

    <div class="card dashed row" data-a="editGoal" style="cursor:pointer">
      <div class="ico">${IC.target}</div>
      <div class="grow"><div class="h3">Defina seu objetivo</div><div class="muted">Libera sua meta diária e mostra quanto ainda cabe no seu dia</div></div>

    <div class="sec">Refeições de hoje</div>

    <div class="card row" data-a="view:${S.meals.indexOf(today)}" style="cursor:pointer">
      <img src="${today.photo}" alt="" style="width:56px;height:56px;object-fit:cover;flex-shrink:0;border-radius:8px">
      <div class="grow"><div class="h3">Almoço${today.local ? " · " + today.local : ""}</div><div class="muted">${today.hora} · ${cores(today)} cores</div></div>

    </div>
    <button class="btn secondary sm" style="width:100%;margin-bottom:12px" data-a="nextDay">Protótipo · simular próximo dia</button>` : `
    <div class="card dashed row" data-a="go:camera" style="cursor:pointer">
      <div class="ico">${IC.camera}</div>
      <div class="grow"><div class="h3">Almoço</div><div class="muted">Ainda sem foto. Toque para fotografar</div></div>
      <span class="chip solid">+20 XP</span>
    </div>`}
    <div class="card dashed row" data-a="addManual" style="cursor:pointer">
      <div class="ico">${IC.plus}</div>
      <div class="grow"><div class="h3">Jantar</div><div class="muted">Adicionar depois</div></div>
    </div>

    ${S.meals.length ? `<div class="sec">Missão do dia</div>${dailyMissions().map(missionCard).join("")}` : ""}

    <div class="sec">Feito pra você</div>

    <div class="card dashed">
      <div class="row"><div class="ico">${IC.lock}</div><div class="grow"><div class="h3">Insights do seu almoço</div><div class="muted">Registre 3 almoços para descobrir seus padrões</div></div></div>
      <div class="row mt12"><div class="bar thin grow"><i style="width:${(S.meals.length / 3) * 100}%"></i></div><span class="tiny">${S.meals.length} / 3</span></div>

      <span style="width:18px">${IC.chev}</span>
    </div>
    <div style="height:12px"></div>
  </div>

</div>`;
};

function dailyMissions() {
  const list = [{ t:"Registre o almoço de hoje", d:"Uma foto do prato no Pluxee Health Scan", prog: registeredToday() ? 1 : 0, tot:1, xp:20 }];
  if (hasWatch()) list.push({ t:"Bata 8 mil passos", d:"Informado por você hoje", prog:Math.min(passosHoje(), USER.metaPassos), tot:USER.metaPassos, xp:15, unit:"passos" });
  return list;
}
function insightCard() {
  const freq = {}; S.meals.forEach(m => { if (m.local) freq[m.local] = (freq[m.local] || 0) + 1; });
  const top = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
  const kc = S.meals.map(m => totalsOf(m.items).kcal);
  const avg = Math.round(kc.reduce((a, b) => a + b, 0) / kc.length);
  const maxM = S.meals[kc.indexOf(Math.max(...kc))];
  const colorful = S.meals.filter(m => cores(m) >= 4).length;
  const txt = S.semNumeros
    ? `${colorful} dos seus ${S.meals.length} almoços tiveram 4 cores ou mais.${top ? ` Seu lugar favorito é o <b>${top[0]}</b>.` : ""}`
    : `Seu almoço tem, em média, <b>${num(avg)} kcal</b>${S.goal ? ` (meta ${USER.metaAlmoco})` : ""}. O mais calórico foi na ${WEEKDAYS[dayInfo(maxM.day).wd].toLowerCase()}.${top ? ` Você mais almoça no <b>${top[0]}</b>.` : ""}`;
  return `<div class="card"><div class="row"><div class="ico">${IC.sparkle}</div><div class="grow"><div class="h3">Seu padrão de almoço</div></div><span class="chip">Novo</span></div><div class="muted mt8">${txt}</div></div>`;
}

function missionCard(m) {
  const pct = Math.min(m.prog / m.tot, 1) * 100;
  const done = m.prog >= m.tot;
  const progTxt = m.unit ? `${num(Math.min(m.prog, m.tot))} / ${num(m.tot)} ${m.unit}` : `${Math.min(m.prog, m.tot)} / ${m.tot}`;
  return `<div class="card">
    <div class="row">
      <div class="ico">${done ? IC.check : IC.target}</div>
      <div class="grow"><div class="h3">${m.t}</div><div class="muted">${m.d}</div></div>
      <span class="chip ${done ? "solid" : ""}">${done ? "Feito" : "+" + m.xp + " XP"}</span>
    </div>
    <div class="row mt12"><div class="bar thin grow"><i style="width:${pct}%"></i></div><span class="tiny">${progTxt}</span></div>
    ${m.badge ? `<div class="tiny mt8">${done ? "Medalha conquistada: " : "Desbloqueia a medalha "}${m.badge}</div>` : ""}
  </div>`;
}

/* ---------- 2. Câmera ---------- */

    <div class="ctx">

/* ---------- 4. Resultado ---------- */
SCREENS.resultado = () => {
  if (!S.meal) return emptyScreen("Resultado", "Análise do seu prato", "hoje", IC.camera,
    "Nenhum prato analisado ainda", "Fotografe seu almoço e o resultado aparece aqui: calorias, nutrientes, cores do prato e onde você estava.");
  const m = S.meal, t = totalsOf(m.items), saved = S.viewing !== null;
  const pctAlmoco = Math.round((t.kcal / USER.metaAlmoco) * 100);
  const nc = cores(m);
  const low = m.items.filter(i => i.conf < 0.6);
  const macroTot = t.c * 4 + t.p * 4 + t.f * 9;
  const colorProg = S.meals.filter(x => cores(x) >= 4).length + (!saved && nc >= 4 ? 1 : 0);
  const firstTime = !saved && S.meals.length === 0;
  return `
<div class="screen">
  ${statusbar()}
  ${topbar(saved ? "Almoço registrado" : "Seu almoço", `${m.local || (saved ? "Sem local" : "Onde você está?")} · ${m.hora}`, { back: saved ? "go:" + (S.backTo || "historico") : "go:camera" })}
  <div class="scroll" style="padding-bottom:${saved ? 30 : 100}px">
    <img src="${m.photo}" alt="Prato analisado" style="width:100%;height:200px;object-fit:cover;display:block">
    <div class="pad">
      <div class="card">
        ${S.semNumeros ? `
          <div class="h2">Prato com ${nc} cores</div>
          <div class="muted">Equilíbrio de carboidrato, proteína e vegetais.</div>
        ` : `
        <div class="row between">
          <div><div class="tiny">Total estimado</div><div class="big">${num(t.kcal)} <span style="font-size:16px">kcal</span></div></div>
          <span class="chip">IA · ajustável</span>
        </div>
        ${S.goal ? `
        <div class="mt12"><div class="row between tiny mb8"><span>${pctAlmoco}% da sua meta de almoço (${USER.metaAlmoco} kcal)</span><span>${pctAlmoco <= 100 ? "Dentro da meta" : "Acima da meta"}</span></div>
        <div class="bar"><i style="width:${Math.min(pctAlmoco,100)}%"></i></div></div>` : `
        <button class="card soft row mt12" data-a="editGoal" style="width:100%;margin-bottom:0;padding:10px 12px"><span style="width:18px">${IC.target}</span><span class="grow tiny" style="text-align:left">Defina seu objetivo para comparar com a sua meta de almoço</span><span style="width:16px">${IC.chev}</span></button>`}
        <div class="divider"></div>
        <div class="segbar"><i style="width:${(t.c*4/macroTot)*100}%"></i><i style="width:${(t.p*4/macroTot)*100}%"></i><i style="width:${(t.f*9/macroTot)*100}%"></i></div>
        <div class="legend"><span>Carbo ${num(t.c)}g</span><span>Proteína ${num(t.p)}g</span><span>Gordura ${num(t.f)}g</span></div>
        `}
      </div>

      ${saved ? "" : placePicker()}

      <div class="card soft row">
        <div class="ico" style="background:var(--c-surface)">${IC.leaf}</div>
        <div class="grow"><div class="h3">${nc} cores no prato</div><div class="muted">${nc >= 4
          ? (S.done.color ? "Prato colorido. Missão Semana Colorida já conquistada!" : `Conta pra missão Semana Colorida (${Math.min(colorProg,3)}/3).`)
          : "Com 4 cores ou mais, o almoço conta pra missão Semana Colorida."}</div></div>
      </div>

      ${low.length ? `<div class="card dashed row"><div style="width:20px">${IC.info}</div><div class="grow muted">Não temos certeza sobre <b>${low.map(i=>i.label).join(", ")}</b>. Confere a porção?</div></div>` : ""}

      <div class="sec">Itens identificados <span class="tiny" style="text-transform:none;letter-spacing:0">toque para ajustar</span></div>
      <div class="card list" style="padding:4px 16px">
        ${m.items.map((it, ix) => `
        <button class="item" data-a="edit:${ix}" style="width:100%">
          <div class="grow">
            <div class="row" style="gap:8px"><b style="font-size:14px">${it.label}</b><span class="conf ${it.conf < .6 ? "low" : ""}">${Math.round(it.conf*100)}%</span></div>
            <div class="muted" style="margin-top:2px">${it.g} g${S.semNumeros ? "" : ` · ${it.kcal} kcal · C ${it.c}g · P ${it.p}g · G ${it.f}g`}</div>
          </div>
          <span style="width:18px;color:var(--c-text-2)">${IC.edit}</span>
        </button>`).join("")}
        <button class="item" data-a="addItem" style="width:100%"><span style="width:18px">${IC.plus}</span><b style="font-size:14px">Adicionar item que a IA não viu</b></button>
      </div>

      ${saved ? "" : `
      <div class="card">
        <div class="h3 mb8">A análise ficou certa?</div>
        <div class="grid2"><button class="btn secondary sm" style="width:100%" data-a="fb:1">Sim</button><button class="btn secondary sm" style="width:100%" data-a="fb:0">Corrigir</button></div>

      </div>`}
    </div>
  </div>
  ${saved ? "" : `
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--c-surface);border-top:1px solid var(--c-line);padding:12px 16px 26px">
    <button class="btn primary" data-a="save">${IC.check}Salvar almoço · +${firstTime ? 50 : 20} XP</button>
  </div>`}
</div>`;
};

function placePicker() {

    const on = S.placeId === id;
    return `<button class="row" data-a="place:${id}" style="width:100%;padding:12px 0;border-bottom:1px solid var(--c-line)">

    </button>`;
  };
  return `<div class="card">
    <div class="row"><div class="ico">${IC.map}</div><div class="grow"><div class="h3">Você está em algum desses?</div><div class="muted">Sugestões pela sua localização agora</div></div></div>
    <div class="mt8">
      ${PLACES.map(p => opt(p.id, p.nome, `${p.tipo} · ${p.dist}`)).join("")}

  </div>`;
}

/* ---------- 5. Histórico ---------- */
SCREENS.historico = () => {
  if (!S.meals.length) return emptyScreen("Histórico", "Seus almoços aparecem aqui", "historico", IC.hist,
    "Ainda não tem nenhum registro", "Cada prato que você fotografar entra aqui com foto, local, calorias e cores. Com 3 registros você ganha seus primeiros insights.");
  const di = dayInfo(S.day), wk = di.week;
  const days = [0,1,2,3,4].map(wd => { const d = wk * 5 + wd, m = mealOfDay(d); return { d:SHORT[wd], k: m ? totalsOf(m.items).kcal : 0, c: m ? cores(m) : 0, today: d === S.day, future: d > S.day }; });
  const max = 1100, goalTop = (1 - USER.metaAlmoco / max) * 100;
  const reg = days.filter(d => d.k);
  const avg = reg.length ? Math.round(reg.reduce((a, d) => a + d.k, 0) / reg.length) : 0;
  const first = dayInfo(wk * 5), last = dayInfo(wk * 5 + 4);
  return `
<div class="screen">
  ${statusbar()}
  ${topbar("Histórico", `Semana de ${first.short.split(", ")[1]} a ${last.short.split(", ")[1]}`)}
  <div class="scroll pad">
    <div class="card">
      <div class="row between mb8"><div class="h3">${S.semNumeros ? "Cores por almoço" : "Almoços da semana"}</div><span class="chip">Semana ▾</span></div>
      ${S.semNumeros ? `
        <div class="bars">${days.map(d=>`<div class="b ${d.today?"today":""} ${!d.c?"empty":""}"><i style="height:${d.c?d.c/6*100:35}%"></i><small>${d.d}</small></div>`).join("")}</div>
      ` : `
      <div class="bars">
        ${S.goal ? `<div class="goal" style="top:${goalTop}%"><span>meta ${USER.metaAlmoco}</span></div>` : ""}
        ${days.map(d => `<div class="b ${d.today ? "today" : ""} ${!d.k ? "empty" : ""}"><i style="height:${d.k ? (d.k/max)*100 : 35}%;${d.future ? "opacity:.35" : ""}"></i><small>${d.d}</small></div>`).join("")}
      </div>
      <div class="grid3 mt16 center">
        <div><div class="tiny">Média</div><b>${num(avg)} kcal</b></div>
        <div><div class="tiny">${S.goal ? "Na meta" : "Coloridos"}</div><b>${S.goal ? days.filter(d=>d.k && d.k<=USER.metaAlmoco).length : days.filter(d=>d.c>=4).length} de ${reg.length}</b></div>
        <div><div class="tiny">Registros</div><b>${S.meals.length} ${S.meals.length === 1 ? "almoço" : "almoços"}</b></div>
      </div>`}
    </div>

    ${S.meals.length >= 3 ? insightCard() : `
    <div class="card dashed row"><div class="ico">${IC.lock}</div><div class="grow muted">Faltam ${3 - S.meals.length} ${3 - S.meals.length === 1 ? "registro" : "registros"} para liberar seus insights de almoço.</div></div>`}

    <div class="sec">Registros</div>
    ${S.meals.slice().reverse().map(histItem).join("")}
    <div class="tiny center mt12">Deslize um registro para a esquerda para excluir</div>
    <div class="tiny center mt8" style="color:var(--c-line-strong)">Fotos ilustrativas: Wikimedia Commons (Tet, Bradleyzm, Fernando Cesar Nox, Vikramdewangan22889, Lucia H Clark · CC0, CC BY, CC BY-SA)</div>
    <div style="height:12px"></div>
  </div>
  ${fnav("historico")}
</div>`;
};
function histItem(m) {
  const i = S.meals.indexOf(m), di = dayInfo(m.day);
  return `<div class="card" data-a="view:${i}" style="cursor:pointer">
    <div class="row">
      <img src="${m.photo}" alt="" style="width:64px;height:64px;object-fit:cover;flex-shrink:0;border-radius:8px">
      <div class="grow">
        <div class="row between"><b style="font-size:14px">${m.day === S.day ? "Hoje" : di.short}</b><b style="font-size:14px">${kcal(totalsOf(m.items).kcal, "")}</b></div>
        <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.items.map(x => x.label).join(", ")}</div>
        <div class="row mt8" style="gap:6px;flex-wrap:wrap"><span class="chip" style="max-width:100%;overflow:hidden;text-overflow:ellipsis">${IC.map.replace('<svg','<svg width="12" height="12"')} ${m.local || "Sem local"}</span><span class="chip">${m.hora} · ${cores(m)} cores</span></div>
      </div>

}
function emptyScreen(title, sub, nav, icon, h, p) {
  return `
<div class="screen">
  ${statusbar()}
  ${topbar(title, sub)}
  <div class="scroll pad" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px 100px">

}

/* ---------- 6. Missões ---------- */
SCREENS.missoes = () => {

/* ---------- 7. Saúde ---------- */

      <div class="muted">Olhe os passos no seu celular ou relógio e informe aqui. Eles viram kcal ativas e somam no seu dia.</div>

/* ---------- 8. Cardápio (antes de pedir) ---------- */
SCREENS.cardapio = () => {
  const d = S.menu || { pratos:[] };
  const meta = USER.metaAlmoco;
  const pratos = (d.pratos || []).filter(p => p && p.nome).map(p => ({ ...p, kcal: +p.kcal || 0, cores: +p.cores || 0 }));
  const score = (p) => (S.goal ? Math.abs(meta - 50 - p.kcal) : p.kcal) - p.cores * 40;
  const ranked = pratos.slice().sort((a, b) => score(a) - score(b));
  const tag = (p, i) => i === 0 ? "Melhor pra você" : (S.goal && p.kcal > meta ? "Acima da meta do almoço" : p.cores >= 4 ? "Conta pra Semana Colorida" : p.kcal && p.kcal < 500 ? "Mais leve" : "");
  return `
<div class="screen">
  ${statusbar()}
  ${topbar("Cardápio lido", d.restaurante || "Restaurante perto de você", { back: "go:camera" })}
  <div class="scroll pad">
    ${S.photo ? `<img src="${S.photo}" alt="Foto do cardápio" style="width:100%;height:140px;object-fit:cover;border-radius:12px;display:block;margin-bottom:12px">` : ""}
    <div class="card soft">
      <div class="h3">${S.goal ? `${USER.nome}, cabem ${S.semNumeros ? "pratos leves" : "até " + meta + " kcal"} no seu almoço` : `${ranked.length} pratos encontrados`}</div>
      <div class="muted mt8">${S.goal ? "Ordenamos os pratos pela sua meta e pela variedade de cores." : "Defina seu objetivo na aba Saúde para ordenar pela sua meta."}</div>
    </div>
    ${ranked.length ? ranked.map((p, i) => `<div class="card row">
      <div class="ico">${IC.cutlery}</div>
      <div class="grow">
        ${tag(p, i) ? `<span class="pill-tag">${tag(p, i)}</span>` : ""}
        <div class="h3" style="margin-top:6px">${p.nome}</div>
        <div class="muted">${S.semNumeros || !p.kcal ? "" : "~" + num(p.kcal) + " kcal · "}${p.cores ? p.cores + " cores" : ""}${p.preco ? " · " + fmt(+p.preco) : ""}</div>
      </div>
      ${i === 0 ? `<span class="chip solid">1º</span>` : ""}
    </div>`).join("") : `<div class="card dashed muted">Não consegui ler pratos nessa foto. Tente enquadrar o cardápio inteiro, com boa luz.</div>`}
    <div class="tiny center">Leitura por IA. Calorias são estimativas de uma porção típica.</div>
    <button class="btn primary mt16" data-a="camPrato">${IC.camera}Já pedi, fotografar o prato</button>
  </div>
</div>`;
};

/* ---------- 9. Rótulo (dados lidos da foto) ---------- */

    ["Energia", v(n.energia_kcal, "kcal")], ["Carboidratos", v(n.carboidratos_g, "g")], ["Açúcares totais", v(n.acucares_totais_g, "g")],

    </div>
    ${d.resumo ? `<div class="card soft"><div class="h3">O que isso significa pra você</div><div class="muted mt8">${d.resumo}</div></div>` : ""}
    ${(d.ingredientes_destaque || []).length ? `<div class="card"><div class="h3 mb8">Ingredientes em destaque</div><div class="row" style="gap:6px;flex-wrap:wrap">${d.ingredientes_destaque.map(x => `<span class="chip">${x}</span>`).join("")}</div></div>` : ""}
    <div class="grid2">
      <button class="btn secondary" data-a="go:hoje">Não vou consumir</button>
      <button class="btn primary" data-a="saveSnack">Registrar lanche</button>

    <div class="tiny center mt12">+10 XP · conta pra medalha Leitor de rótulos</div>

/* =========================================================
   CAMADAS (sheets e diálogos)
   ========================================================= */

  const it = S.meal.items[+id];

  const presets = [["Pequena", .5], ["Média", 1], ["Grande", 1.5], ["Extra", 2]];
  openLayer(`<div class="sheet" data-stop>

    <div class="tiny mb8 mt12">Porção</div>
    <div class="presets">${presets.map(([l, r]) => `<button data-p="${Math.round(base.g*r)}" class="${r===1?"on":""}">${l}</button>`).join("")}</div>
    <div class="tiny mt16">Ajuste fino: <b id="gval">${it.g} g</b></div>
    <input type="range" min="10" max="400" step="5" value="${it.g}" id="grange">
    <div class="card soft mt12 grid2" id="calc"></div>

/* =========================================================
   CÂMERA AO VIVO (getUserMedia) com fallback para a câmera nativa
   ========================================================= */
const CAM = { stream:null, error:null };
async function startCamera() {
  const v = document.getElementById("camvideo");
  if (!v) return;
  if (CAM.stream) { v.srcObject = CAM.stream; return; }
  if (!window.isSecureContext) { CAM.error = "insecure"; render(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { CAM.error = "unsupported"; render(); return; }
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    if (S.screen !== "camera") { stopCamera(); return; }
    CAM.error = null;
    const v2 = document.getElementById("camvideo"); if (v2) v2.srcObject = CAM.stream;
  } catch (e) {
    CAM.error = (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) ? "denied" : "unsupported";
    render();
  }
}
function stopCamera() {
  if (CAM.stream) { CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; }
}
function shrinkToDataURL(source, w, h, max = 640) {
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.75);
}
function captureFrame() {
  const v = document.getElementById("camvideo");
  if (!CAM.stream || !v || !v.videoWidth) return null;
  const f = document.createElement("div"); f.className = "flash"; document.getElementById("phone").appendChild(f); setTimeout(() => f.remove(), 400);
  return shrinkToDataURL(v, v.videoWidth, v.videoHeight);
}

/* =========================================================
   ANÁLISE POR IA
   Usa a função analyze-food do projeto Lovable (Gemini 2.5 Flash + base TACO).
   Primeiro tenta o backend próprio (api/analyze.php); se não estiver configurado, usa o Lovable.
   ========================================================= */
const API_URL = "api/analyze.php"; // backend próprio na Hostinger (PHP)
const LOVABLE_URL = "https://ngubhqtfptphoxqnutuy.supabase.co/functions/v1/analyze-food"; // reserva, só para prato
const COLOR_RULES = [
  ["verde", /alface|r[uú]cula|couve|br[oó]colis|salada|espinafre|agri[aã]o|vagem|ervilha|abobrinha|pepino|chuchu|piment[aã]o verde|folha|ervas|salsa|cebolinha|abacate|kiwi|lim[aã]o/i],
  ["vermelho", /tomate|beterraba|morango|pimenta|lingui[cç]a|calabresa|melancia|piment[aã]o vermelho|ketchup|molho de tomate/i],
  ["laranja", /cenoura|ab[oó]bora|laranja|mam[aã]o|manga|batata doce|salm[aã]o|moranga/i],
  ["amarelo", /batata frita|fritas|farofa|milho|ovo|omelete|polenta|mandioca|aipim|banana|abacaxi|queijo|maionese|mostarda/i],
  ["preto", /feij[aã]o preto|feijoada|azeitona|shoyu/i],
  ["marrom", /feij[aã]o|carne|bife|frango assado|picanha|alcatra|cupim|fil[eé]|cogumelo|gr[aã]o|lentilha|caf[eé]|chocolate|integral|cebola refogada|cebola/i],
  ["branco", /arroz|pur[eê]|macarr[aã]o|massa|peixe|til[aá]pia|p[aã]o|tapioca|couve-flor|frango|peito|queijo branco|iogurte|batata/i]
];
const guessColor = (label) => { for (const [cor, re] of COLOR_RULES) if (re.test(label)) return cor; return "outro"; };
async function postJSON(url, body, ms = 50000) {
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body), signal: ctrl.signal });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  } catch (e) { return { ok:false, status:0, data:{ error: e.name === "AbortError" ? "tempo esgotado" : "sem conexão" } }; }
  finally { clearTimeout(to); }
}
function mapItems(items) {
  return items.map(it => ({
    label: it.label || "Alimento", conf: Math.max(0, Math.min(1, +it.confidence || .5)),
    g: Math.round(+it.portionGrams || 0), kcal: Math.round(+it.kcal || 0),
    c: Math.round((it.macros && +it.macros.carbs) || 0), p: Math.round((it.macros && +it.macros.protein) || 0),
    f: Math.round(((it.macros && +it.macros.fat) || 0) * 10) / 10, cor: guessColor(it.label || "")
  }));
}
/* mode: prato | rotulo | cardapio */
async function analyzeReal(photo, mode = "prato") {
  let last = "", backendMissing = false;
  for (let attempt = 0; attempt < 2; attempt++) {
    const r = await postJSON(API_URL, { mode, imageBase64: photo }, 70000);
    if (r.ok) {
      if (mode === "prato") { if (Array.isArray(r.data.items) && r.data.items.length) return mapItems(r.data.items); }
      else return r.data;
    }
    last = r.data.error || ("HTTP " + r.status);
    backendMissing = r.status === 404 || /não configurado|ausente/i.test(last);
    if (backendMissing || [400, 403, 413, 422].includes(r.status)) break;
    if (r.status === 0) break; // sem conexão ou tempo esgotado
  }
  // reserva (só prato): função do Lovable, usada apenas se o backend próprio não estiver configurado
  if (mode === "prato" && backendMissing) {
    const r = await postJSON(LOVABLE_URL, { imageBase64: photo }, 30000);
    if (r.ok && Array.isArray(r.data.items) && r.data.items.length) return mapItems(r.data.items);
  }
  throw new Error(last || "falha na análise");
}
const nowHora = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

   AÇÕES
   ========================================================= */
function shoot() {
  const frame = captureFrame();
  if (frame) { S.photo = frame; analyzePhoto(); return; }
  const cap = document.getElementById("filecap");
  if (cap) cap.click(); else toast("Abra pelo celular para usar a câmera", IC.info);

function analyzePhoto(useDemo) {
  stopCamera();
  const mode = useDemo ? "prato" : S.camMode;
  S.anMode = mode; S.anError = null;
  const demo = DEMOS[S.demoIdx % DEMOS.length];
  if (mode === "prato") S.meal = { day:S.day, hora: useDemo ? demo.hora : nowHora(), local:null, photo: useDemo ? demo.photo : S.photo, items:[], demo: !!useDemo };
  else S.meal = null;
  S.viewing = null; S.placeId = null;
  S.screen = "analisando"; render();
  const steps = (i) => { const l = document.querySelectorAll("#steps li"); if (!l.length) return; l.forEach((li, k) => li.className = k < i ? "done" : k === i ? "now" : ""); };
  let i = 0; const timer = setInterval(() => { if (i < 3) steps(++i); }, 1200);
  const slow = setTimeout(() => { const w = document.getElementById("waitmsg"); if (w) w.textContent = "A IA está mais lenta agora. Estamos tentando de novo automaticamente…"; }, 9000);
  const minWait = new Promise(r => setTimeout(r, 2200));
  const job = useDemo ? Promise.resolve(JSON.parse(JSON.stringify(demo.items))) : analyzeReal(S.photo, mode);
  Promise.all([job, minWait]).then(([result]) => {
    clearInterval(timer); clearTimeout(slow); steps(4);
    if (S.screen !== "analisando") return;
    if (mode === "prato") { S.meal.items = result; S.screen = "resultado"; }
    else if (mode === "rotulo") { S.label = result; S.rotulo = true; S.screen = "rotulo"; }
    else { S.menu = result; S.screen = "cardapio"; }
    render();
    if (mode === "rotulo") celebrateQuick(checkMissions());
    if (useDemo) toast("Foto de exemplo · análise simulada", IC.info);
  }).catch((err) => {
    clearInterval(timer); clearTimeout(slow);
    if (S.screen !== "analisando") return;
    S.anError = err.message; console.warn("análise:", err);
    S.screen = "erroAnalise"; render();
  });
}

function renderNotes() {
  const n = NOTES[S.screen] || NOTES.home;
  document.getElementById("notes").innerHTML = `
    <h2>Pluxee Health Scan · wireframe</h2>
    <div class="sub">Notas da tela: <b>${n.t}</b></div>
    <ol>${n.n.map(([tag, txt]) => `<li><span class="tag">${tag}</span>${txt}</li>`).join("")}</ol>
    <div class="jump"><div class="sub" style="margin-bottom:6px">Ir para tela</div>
      ${[["home","0. Home Pluxee"],["hoje","1. Hoje"],["camera","2. Câmera"],["resultado","4. Resultado"],["historico","5. Histórico"],["missoes","6. Missões"],["saude","7. Saúde"],["cardapio","8. Cardápio"],["rotulo","9. Rótulo"]].map(([s,l])=>`<button data-a="jump:${s}">${l}</button>`).join("")}
      <div class="sub" style="margin:12px 0 6px">Simulação</div>
      <button data-a="nextDay">Avançar para o próximo dia (${dayInfo(S.day + 1).short})</button>
      <button data-a="reset">Reiniciar protótipo (estado vazio)</button>
      <p class="sub" style="margin-top:8px">Dia atual: <b>${dayInfo(S.day).long}</b> · ${S.meals.length} almoços · ${S.xp} XP · ${S.badges.length} medalhas</p>
    </div>
    <p class="sub" style="margin-top:16px">DS Pluxee aplicado a partir do Figma (tokens plx/semantic). Fonte do DS: TT Travels; aqui usamos DM Sans como substituta até a licença ser carregada.</p>`;
}
ACTIONS.jump = (s) => {
  closeLayer();
  if (s === "resultado") {
    if (S.meals.length) { S.viewing = S.meals.length - 1; S.meal = S.meals[S.viewing]; S.backTo = "historico"; }
    else { S.meal = null; S.viewing = null; }
  }
  S.screen = s; render();
};

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  document.querySelectorAll(".push").forEach(p => p.remove());
  $app.innerHTML = SCREENS[S.screen]();
  const sc = $app.querySelector(".scroll"); if (sc) sc.scrollTop = 0;
  if (S.screen === "camera") { if (!CAM.error) startCamera(); } else { stopCamera(); CAM.error = null; }
  persist();
  if (S.screen === "home" && !S.pushShown && !registeredToday()) {
    S.pushShown = true;
    setTimeout(() => {
      if (S.screen !== "home") return;
      const p = document.createElement("div");
      p.className = "push";
      p.innerHTML = `<div class="app"><i></i>PLUXEE · agora</div><b style="font-size:14px">Bom almoço, ${USER.nome}!</b><div class="muted" style="font-size:13px">Abre o Pluxee Health Scan, fotografa seu prato e ${streak() ? `chega a ${streak() + 1} dias seguidos` : "comece sua sequência hoje"}.</div>`;
      p.onclick = () => { p.remove(); S.screen = "camera"; render(); };
      document.getElementById("phone").appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }, 1200);
  }
}
render();
</script>
